name: Budget Monitor

on:
  workflow_dispatch:

  schedule:
    # 매일 09:10 KST
    - cron: "10 0 * * *"

    # 1차 실패 등에 대비한 추가 실행
    # 매일 09:40 KST
    - cron: "40 0 * * *"

    # 매일 10:10 KST
    - cron: "10 1 * * *"

permissions:
  contents: write

jobs:
  budget-monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests

      - name: Run budget monitor
        env:
          LOFIN_API_KEY: ${{ secrets.LOFIN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python budget_monitor.py

      - name: Save budget history and snapshot
        if: always()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f seen_budget_ids.json ]; then
            git add seen_budget_ids.json
          fi

          if [ -f budget_snapshot.json ]; then
            git add budget_snapshot.json
          fi

          if ! git diff --cached --quiet; then

            git commit -m "Update budget monitor state"

            git push

          else

            echo "No budget state changes"

          fi
